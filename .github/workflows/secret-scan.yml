# Pemindai rahasia — Ketentuan 8.
# Kredensial yang ter-commit membatalkan nilai artefak sesi itu. Pemeriksaan ini menangkapnya
# saat push, bukan saat penilaian, supaya kamu sempat memperbaiki.
# Berkas milik dosen. Jangan diubah (Ketentuan 5).
name: secret-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pindai berkas yang dilacak git
        shell: python
        run: |
          import re, subprocess, sys

          POLA = [
              ("Berkas .env ter-commit",        re.compile(r"^\.env(\.|$)(?!example)")),
              ("Kunci privat",                  re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----")),
              ("Connection string Postgres",    re.compile(r"postgres(?:ql)?(?:\+\w+)?://[^\s:@/]+:[^\s@/]+@")),
              ("Token GitHub",                  re.compile(r"\bgh[pousr]_[A-Za-z0-9]{30,}")),
              ("Kunci AWS",                     re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("Kunci OpenAI/Anthropic",        re.compile(r"\bsk-(?:ant-)?[A-Za-z0-9_\-]{24,}")),
              ("Secret key terisi",             re.compile(r"(?i)\b(secret_key|api_key|password|passwd|token)\s*[:=]\s*['\"][^'\"\s]{8,}['\"]")),
          ]
          LEWATI = re.compile(r"(^|/)(\.env\.example|package-lock\.json|node_modules/|\.github/workflows/secret-scan\.yml)")

          berkas = subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split()
          temuan = []
          for f in berkas:
              if LEWATI.search(f):
                  continue
              if POLA[0][1].match(f):
                  temuan.append((f, 0, POLA[0][0]))
                  continue
              try:
                  with open(f, encoding="utf-8", errors="ignore") as fh:
                      for n, baris in enumerate(fh, 1):
                          if len(baris) > 4000:
                              continue
                          for nama, pola in POLA[1:]:
                              if pola.search(baris):
                                  temuan.append((f, n, nama))
              except OSError:
                  pass

          if temuan:
              print("\nRAHASIA TERDETEKSI — Ketentuan 8\n")
              for f, n, nama in temuan:
                  print(f"  {f}:{n}  {nama}")
              print(
                  "\nLangkah: hapus nilainya, pindahkan ke .env (yang sudah di-.gitignore),"
                  "\nROTASI kredensialnya, lalu commit ulang. Melapor lebih baik daripada ditemukan.\n"
              )
              sys.exit(1)
          print("Bersih — tidak ada rahasia terdeteksi.")
